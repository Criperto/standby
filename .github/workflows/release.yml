name: Release & APK Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versión para publicar como latest (ej. v0.5.0)'
        required: false
        default: 'v0.5.0'

permissions:
  contents: write

jobs:
  build-apk-release:
    name: Build StandBy APK (arm64-v8a) & Publish Latest Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & NDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Set up Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Run Rust test suite & preset validation
        run: |
          cd rust
          cargo test --workspace
          cargo run --bin standby-cli -- validate ../android/app/src/main/assets/presets/*.json

      - name: Build Rust standby-core (arm64-v8a, 16KB page-aligned) & UniFFI bindings
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/java dist
          cd rust
          RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" \
            cargo ndk --target arm64-v8a --platform 31 -o ../android/app/src/main/jniLibs \
            build -p standby-core --release
          cargo run -p standby-core --bin uniffi-bindgen -- generate \
            --library ../android/app/src/main/jniLibs/arm64-v8a/libstandby_core.so \
            --language kotlin \
            --out-dir ../android/app/src/main/java

      - name: Build Android APK (R8 Optimized Release) & Run Unit Tests
        run: |
          cd android
          chmod +x gradlew
          export STANDBY_SKIP_GRADLE_RUST=1
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.5.0"
          fi
          cp -f app/build/outputs/apk/release/app-release.apk "../dist/StandBy-v${VERSION}-arm64-v8a.apk"
          cp -f app/build/outputs/apk/release/app-release.apk "../dist/StandBy-latest-arm64-v8a.apk"
          cd ../dist
          sha256sum "StandBy-v${VERSION}-arm64-v8a.apk" > "StandBy-v${VERSION}-arm64-v8a.apk.sha256"
          sha256sum "StandBy-latest-arm64-v8a.apk" > "StandBy-latest-arm64-v8a.apk.sha256"

      - name: Create GitHub Release (Always Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: "true"
