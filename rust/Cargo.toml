[workspace]
resolver = "2"
members = [
    "standby-core",
    "standby-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Criperto (Tomas) <dev@criperto.com>"]
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
